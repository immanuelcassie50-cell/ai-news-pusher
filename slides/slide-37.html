<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六格模型个体侧详解</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
}
.slide-content {
  width: 960px;
  height: 540px;
  position: relative;
  transform-origin: center center;
}
</style>
<script>
function scaleSlide() {
  const slide = document.querySelector('.slide-content');
  if (!slide) return;
  const slideWidth = 960;
  const slideHeight = 540;
  const scaleX = window.innerWidth / slideWidth;
  const scaleY = window.innerHeight / slideHeight;
  const scale = Math.min(scaleX, scaleY);
  slide.style.width = slideWidth + 'px';
  slide.style.height = slideHeight + 'px';
  slide.style.transform = `scale(${scale})`;
  slide.style.transformOrigin = 'center center';
  slide.style.flexShrink = '0';
}
window.addEventListener('load', scaleSlide);
window.addEventListener('resize', scaleSlide);
</script>
</head>
<body>
<div class="slide-content" style="background:#2b2d42; font-family:'Microsoft YaHei','Times New Roman',serif;">

<!-- Top accent bar -->
<svg style="position:absolute; top:0; left:0;" width="960" height="8" viewBox="0 0 960 8">
  <rect width="960" height="8" fill="#ef233c"/>
</svg>

<!-- Left decorative geometric shapes -->
<svg style="position:absolute; top:60px; left:40px;" width="80" height="80" viewBox="0 0 80 80" aria-hidden="true">
  <rect x="10" y="10" width="60" height="60" fill="none" stroke="#ef233c" stroke-width="2" opacity="0.3"/>
  <rect x="22" y="22" width="36" height="36" fill="none" stroke="#ef233c" stroke-width="2" opacity="0.5"/>
  <rect x="32" y="32" width="16" height="16" fill="#ef233c" opacity="0.2"/>
</svg>

<!-- Section number badge -->
<svg style="position:absolute; top:80px; left:140px;" width="60" height="60" viewBox="0 0 60 60">
  <circle cx="30" cy="30" r="28" fill="#ef233c"/>
  <text x="30" y="30" text-anchor="middle" dominant-baseline="central" font-size="28" font-weight="700" fill="#ffffff">37</text>
</svg>

<!-- Main title -->
<p style="position:absolute; top:80px; left:220px; margin:0; font-size:44px; font-weight:700; color:#edf2f4; letter-spacing:4px;">六格模型个体侧详解</p>

<!-- Subtitle -->
<p style="position:absolute; top:140px; left:220px; margin:0; font-size:22px; font-weight:400; color:#8d99ae; letter-spacing:2px;">落地与转化</p>

<!-- Decorative line -->
<svg style="position:absolute; top:185px; left:220px;" width="250" height="3" aria-hidden="true">
  <rect width="250" height="3" fill="#ef233c"/>
</svg>

<!-- Three-column process flow -->
<!-- Step 1 -->
<svg style="position:absolute; top:230px; left:80px;" width="240" height="180" viewBox="0 0 240 180">
  <rect width="240" height="180" rx="10" fill="#8d99ae" opacity="0.12"/>
  <rect x="90" y="20" width="60" height="60" rx="30" fill="#ef233c"/>
  <text x="120" y="50" text-anchor="middle" dominant-baseline="central" font-size="28" font-weight="700" fill="#ffffff">1</text>
  <text x="120" y="100" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#edf2f4">认知重构</text>
  <text x="120" y="130" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8d99ae">理解六格模型</text>
  <text x="120" y="150" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8d99ae">核心框架</text>
</svg>

<!-- Arrow 1 -->
<svg style="position:absolute; top:300px; left:320px;" width="40" height="16" viewBox="0 0 40 16" aria-hidden="true">
  <path d="M0 8 L32 8 M24 2 L32 8 L24 14" stroke="#ef233c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>

<!-- Step 2 -->
<svg style="position:absolute; top:230px; left:360px;" width="240" height="180" viewBox="0 0 240 180">
  <rect width="240" height="180" rx="10" fill="#8d99ae" opacity="0.12"/>
  <rect x="90" y="20" width="60" height="60" rx="30" fill="#d90429"/>
  <text x="120" y="50" text-anchor="middle" dominant-baseline="central" font-size="28" font-weight="700" fill="#ffffff">2</text>
  <text x="120" y="100" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#edf2f4">工具应用</text>
  <text x="120" y="130" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8d99ae">练习1与练习2</text>
  <text x="120" y="150" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8d99ae">实操演练</text>
</svg>

<!-- Arrow 2 -->
<svg style="position:absolute; top:300px; left:600px;" width="40" height="16" viewBox="0 0 40 16" aria-hidden="true">
  <path d="M0 8 L32 8 M24 2 L32 8 L24 14" stroke="#d90429" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>

<!-- Step 3 -->
<svg style="position:absolute; top:230px; left:640px;" width="240" height="180" viewBox="0 0 240 180">
  <rect width="240" height="180" rx="10" fill="#8d99ae" opacity="0.12"/>
  <rect x="90" y="20" width="60" height="60" rx="30" fill="#8d99ae"/>
  <text x="120" y="50" text-anchor="middle" dominant-baseline="central" font-size="28" font-weight="700" fill="#2b2d42">3</text>
  <text x="120" y="100" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#edf2f4">成果转化</text>
  <text x="120" y="130" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8d99ae">落地执行</text>
  <text x="120" y="150" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#8d99ae">持续改进</text>
</svg>

<!-- Bottom tagline -->
<p style="position:absolute; bottom:60px; left:0; right:0; text-align:center; margin:0; font-size:16px; font-weight:400; color:#8d99ae; letter-spacing:4px;">知行合一 · 学以致用</p>

<!-- Page number badge -->
<svg style="position:absolute; right:32px; bottom:24px;" width="36" height="36" viewBox="0 0 36 36">
  <circle cx="18" cy="18" r="18" fill="#ef233c"/>
  <text x="18" y="18" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#ffffff">37</text>
</svg>

<!-- Bottom accent bar -->
<svg style="position:absolute; bottom:0; left:0;" width="960" height="6" viewBox="0 0 960 6">
  <rect width="960" height="6" fill="#ef233c"/>
</svg>

</div>
</body>
</html>
