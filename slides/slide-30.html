<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实操四指令页</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
}
.slide-content {
  width: 960px;
  height: 540px;
  position: relative;
  transform-origin: center center;
}
</style>
<script>
function scaleSlide() {
  const slide = document.querySelector('.slide-content');
  if (!slide) return;
  const slideWidth = 960;
  const slideHeight = 540;
  const scaleX = window.innerWidth / slideWidth;
  const scaleY = window.innerHeight / slideHeight;
  const scale = Math.min(scaleX, scaleY);
  slide.style.width = slideWidth + 'px';
  slide.style.height = slideHeight + 'px';
  slide.style.transform = `scale(${scale})`;
  slide.style.transformOrigin = 'center center';
  slide.style.flexShrink = '0';
}
window.addEventListener('load', scaleSlide);
window.addEventListener('resize', scaleSlide);
</script>
</head>
<body>
<div class="slide-content" style="background:#2b2d42; font-family:'Microsoft YaHei','Times New Roman',serif;">

<!-- Top accent bar -->
<svg style="position:absolute; top:0; left:0;" width="960" height="8" viewBox="0 0 960 8">
  <rect width="960" height="8" fill="#ef233c"/>
</svg>

<!-- Left decorative geometric shapes -->
<svg style="position:absolute; top:60px; left:40px;" width="80" height="80" viewBox="0 0 80 80" aria-hidden="true">
  <circle cx="40" cy="40" r="35" fill="none" stroke="#ef233c" stroke-width="2" opacity="0.3"/>
  <circle cx="40" cy="40" r="22" fill="none" stroke="#ef233c" stroke-width="2" opacity="0.5"/>
  <circle cx="40" cy="40" r="10" fill="#ef233c" opacity="0.2"/>
</svg>

<!-- Section number badge -->
<svg style="position:absolute; top:80px; left:160px;" width="60" height="60" viewBox="0 0 60 60">
  <circle cx="30" cy="30" r="28" fill="#ef233c"/>
  <text x="30" y="30" text-anchor="middle" dominant-baseline="central" font-size="28" font-weight="700" fill="#ffffff">30</text>
</svg>

<!-- Main title -->
<p style="position:absolute; top:80px; left:240px; margin:0; font-size:44px; font-weight:700; color:#edf2f4; letter-spacing:4px;">实操四指令页</p>

<!-- Subtitle -->
<p style="position:absolute; top:140px; left:240px; margin:0; font-size:24px; font-weight:400; color:#8d99ae; letter-spacing:2px;">方太的战略指南针</p>

<!-- Decorative line -->
<svg style="position:absolute; top:185px; left:240px;" width="300" height="3" aria-hidden="true">
  <rect width="300" height="3" fill="#ef233c"/>
</svg>

<!-- Content section - left side text area -->
<div style="position:absolute; top:220px; left:60px; width:400px;">
  <p style="margin:0; font-size:18px; font-weight:600; color:#ef233c; letter-spacing:2px; margin-bottom:16px;">核心要点</p>
  <ul style="margin:0; padding-left:24px; font-size:16px; line-height:2; color:#edf2f4;">
    <li>战略方向明确化</li>
    <li>目标分解具体化</li>
    <li>执行路径可视化</li>
    <li>效果评估可量化</li>
  </ul>
</div>

<!-- Right side - Image from PPTX -->
<div style="position:absolute; top:200px; left:500px; width:420px; height:300px; border:3px solid #8d99ae; border-radius:8px; overflow:hidden;">
  <img src="../temp/ppt_student/ppt/media/image18.png" style="width:100%; height:100%; object-fit:contain;" alt="方太战略指南针"/>
</div>

<!-- Bottom decorative elements -->
<svg style="position:absolute; bottom:60px; left:60px;" width="120" height="4" viewBox="0 0 120 4">
  <rect width="120" height="4" fill="#8d99ae" opacity="0.5"/>
</svg>

<!-- Page number badge -->
<svg style="position:absolute; right:32px; bottom:24px;" width="36" height="36" viewBox="0 0 36 36">
  <circle cx="18" cy="18" r="18" fill="#ef233c"/>
  <text x="18" y="18" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#ffffff">30</text>
</svg>

<!-- Bottom accent bar -->
<svg style="position:absolute; bottom:0; left:0;" width="960" height="6" viewBox="0 0 960 6">
  <rect width="960" height="6" fill="#ef233c"/>
</svg>

</div>
</body>
</html>
