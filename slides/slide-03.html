<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>这门课适合谁</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
}
.slide-content {
  width: 960px;
  height: 540px;
  position: relative;
  transform-origin: center center;
}
</style>
<script>
function scaleSlide() {
  const slide = document.querySelector('.slide-content');
  if (!slide) return;
  const slideWidth = 960;
  const slideHeight = 540;
  const scaleX = window.innerWidth / slideWidth;
  const scaleY = window.innerHeight / slideHeight;
  const scale = Math.min(scaleX, scaleY);
  slide.style.width = slideWidth + 'px';
  slide.style.height = slideHeight + 'px';
  slide.style.transform = `scale(${scale})`;
  slide.style.transformOrigin = 'center center';
  slide.style.flexShrink = '0';
}
window.addEventListener('load', scaleSlide);
window.addEventListener('resize', scaleSlide);
</script>
</head>
<body>
<div class="slide-content" style="background:#f8f9fa; font-family:'Microsoft YaHei','Arial',sans-serif;">

<!-- Title -->
<p style="position:absolute; top:35px; left:60px; margin:0; font-size:36px; font-weight:700; color:#2b2d42; letter-spacing:3px;">这门课适合谁</p>

<!-- Decorative line -->
<svg style="position:absolute; top:85px; left:60px;" width="60" height="4" aria-hidden="true">
  <rect width="60" height="4" fill="#ef233c"/>
</svg>

<!-- Left column - Three audience types -->
<!-- Item 1 -->
<svg style="position:absolute; top:120px; left:60px;" width="420" height="70" viewBox="0 0 420 70">
  <rect width="420" height="70" rx="6" fill="#edf2f4"/>
  <circle cx="40" cy="35" r="18" fill="#ef233c" opacity="0.15"/>
  <text x="40" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#ef233c">1</text>
  <text x="75" y="30" font-size="15" font-weight="600" fill="#2b2d42">新入行的志愿填报师</text>
  <text x="75" y="50" font-size="13" font-weight="400" fill="#8d99ae">想建立系统的认知框架</text>
</svg>

<!-- Item 2 -->
<svg style="position:absolute; top:200px; left:60px;" width="420" height="70" viewBox="0 0 420 70">
  <rect width="420" height="70" rx="6" fill="#edf2f4"/>
  <circle cx="40" cy="35" r="18" fill="#ef233c" opacity="0.15"/>
  <text x="40" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#ef233c">2</text>
  <text x="75" y="30" font-size="15" font-weight="600" fill="#2b2d42">想转型的教育从业者</text>
  <text x="75" y="50" font-size="13" font-weight="400" fill="#8d99ae">想从工具依赖转向判断力驱动</text>
</svg>

<!-- Item 3 -->
<svg style="position:absolute; top:280px; left:60px;" width="420" height="70" viewBox="0 0 420 70">
  <rect width="420" height="70" rx="6" fill="#edf2f4"/>
  <circle cx="40" cy="35" r="18" fill="#ef233c" opacity="0.15"/>
  <text x="40" y="40" text-anchor="middle" font-size="16" font-weight="700" fill="#ef233c">3</text>
  <text x="75" y="30" font-size="15" font-weight="600" fill="#2b2d42">焦虑的资深从业者</text>
  <text x="75" y="50" font-size="13" font-weight="400" fill="#8d99ae">想厘清AI时代的核心竞争力</text>
</svg>

<!-- Right column - Visual diagram -->
<svg style="position:absolute; top:120px; right:60px;" width="360" height="240" viewBox="0 0 360 240" aria-hidden="true">
  <!-- Background card -->
  <rect width="360" height="240" rx="12" fill="#2b2d42"/>

  <!-- Left side - 工具 -->
  <rect x="30" y="80" width="120" height="80" rx="8" fill="#ef233c" opacity="0.2"/>
  <text x="90" y="115" text-anchor="middle" font-size="16" font-weight="600" fill="#edf2f4">工具</text>
  <text x="90" y="140" text-anchor="middle" font-size="24" font-weight="700" fill="#ef233c">越来越强</text>

  <!-- Arrow -->
  <path d="M160 120 L200 120 M190 110 L200 120 L190 130" stroke="#8d99ae" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Right side - 判断力 -->
  <rect x="210" y="80" width="120" height="80" rx="8" fill="#ef233c" opacity="0.4"/>
  <text x="270" y="115" text-anchor="middle" font-size="16" font-weight="600" fill="#edf2f4">判断力</text>
  <text x="270" y="140" text-anchor="middle" font-size="24" font-weight="700" fill="#edf2f4">越来越重要</text>

  <!-- Top label -->
  <text x="180" y="45" text-anchor="middle" font-size="14" font-weight="400" fill="#8d99ae">AI时代</text>

  <!-- Bottom emphasis -->
  <rect x="80" y="190" width="200" height="30" rx="4" fill="#ef233c"/>
  <text x="180" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#edf2f4">核心价值转移</text>
</svg>

<!-- Bottom quote -->
<svg style="position:absolute; bottom:60px; left:60px; right:60px;" width="840" height="60" viewBox="0 0 840 60">
  <rect width="840" height="60" rx="6" fill="#2b2d42"/>
  <text x="420" y="38" text-anchor="middle" font-size="16" font-weight="500" fill="#edf2f4">"会做这四件事的人，不管手里有没有工具，都能把这份工作做扎实"</text>
</svg>

<!-- Page number badge -->
<svg style="position:absolute; right:32px; bottom:24px;" width="36" height="36" viewBox="0 0 36 36">
  <circle cx="18" cy="18" r="18" fill="#2b2d42"/>
  <text x="18" y="18" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#edf2f4">3</text>
</svg>

</div>
</body>
</html>
