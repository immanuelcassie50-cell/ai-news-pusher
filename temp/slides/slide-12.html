<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>典型案例分析</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
}
.slide-content {
  width: 960px;
  height: 540px;
  position: relative;
  transform-origin: center center;
  background: #F5F5F5;
}
</style>
<script>
function scaleSlide() {
  const slide = document.querySelector('.slide-content');
  if (!slide) return;
  const slideWidth = 960;
  const slideHeight = 540;
  const scaleX = window.innerWidth / slideWidth;
  const scaleY = window.innerHeight / slideHeight;
  const scale = Math.min(scaleX, scaleY);
  slide.style.width = slideWidth + 'px';
  slide.style.height = slideHeight + 'px';
  slide.style.transform = `scale(${scale})`;
  slide.style.transformOrigin = 'center center';
  slide.style.flexShrink = '0';
}
window.addEventListener('load', scaleSlide);
window.addEventListener('resize', scaleSlide);
</script>
</head>
<body>
<div class="slide-content">
  <!-- Top accent bar -->
  <svg style="position:absolute; top:0; left:0;" width="960" height="6" viewBox="0 0 960 6">
    <rect width="960" height="6" fill="#8B0000"/>
  </svg>

  <!-- Title -->
  <p style="position:absolute; left:60px; top:40px; margin:0; font-size:28px; font-weight:700; color:#8B0000; font-family:'Microsoft YaHei', Arial;">典型案例分析</p>

  <!-- Case label -->
  <svg style="position:absolute; left:60px; top:95px;" width="80" height="28" viewBox="0 0 80 28">
    <rect width="80" height="28" rx="4" fill="#C41E3A"/>
    <text x="40" y="18" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#FFFFFF" font-family:'Microsoft YaHei', Arial;">案例</text>
  </svg>

  <!-- Case content card -->
  <div style="position:absolute; left:60px; top:135px; width:840px; background:#FFFFFF; border-radius:8px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
    <p style="margin:0 0 16px 0; font-size:16px; font-weight:700; color:#333333; font-family:'Microsoft YaHei', Arial;">一位爸爸用小程序排好了梯度表，觉得没问题</p>

    <div style="display:flex; gap:40px;">
      <div style="flex:1;">
        <p style="margin:0 0 8px 0; font-size:14px; color:#8B0000; font-family:'Microsoft YaHei', Arial; font-weight:600;">技术上</p>
        <p style="margin:0; font-size:14px; color:#333333; font-family:'Microsoft YaHei', Arial;">确实没有硬伤</p>
      </div>

      <div style="flex:1;">
        <p style="margin:0 0 8px 0; font-size:14px; color:#8B0000; font-family:'Microsoft YaHei', Arial; font-weight:600;">但孩子喜欢</p>
        <p style="margin:0; font-size:14px; color:#333333; font-family:'Microsoft YaHei', Arial;">策略类游戏的资源调度和数值平衡</p>
      </div>

      <div style="flex:1;">
        <p style="margin:0 0 8px 0; font-size:14px; color:#8B0000; font-family:'Microsoft YaHei', Arial; font-weight:600;">结果</p>
        <p style="margin:0; font-size:14px; color:#333333; font-family:'Microsoft YaHei', Arial;">前八个冲的专业全是没有跟孩子思维匹配的方向</p>
      </div>
    </div>
  </div>

  <!-- Divider -->
  <svg style="position:absolute; left:60px; top:320px;" width="840" height="2" aria-hidden="true">
    <rect width="840" height="2" fill="#E0E0E0"/>
  </svg>

  <!-- Insight section -->
  <div style="position:absolute; left:60px; top:340px; width:840px;">
    <svg style="position:absolute; left:0; top:0;" width="28" height="28" viewBox="0 0 28 28">
      <circle cx="14" cy="14" r="14" fill="#8B0000"/>
      <text x="14" y="14" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#FFFFFF" font-family:'Microsoft YaHei', Arial;">!</text>
    </svg>

    <p style="position:absolute; left:44px; top:4px; margin:0; font-size:16px; font-weight:700; color:#8B0000; font-family:'Microsoft YaHei', Arial;">启示</p>

    <p style="position:absolute; left:44px; top:36px; margin:0; font-size:18px; color:#333333; font-family:'Microsoft YaHei', Arial;">要先问"这孩子是谁"，再检查表格对不对</p>
  </div>

  <!-- Visual element -->
  <svg style="position:absolute; right:60px; bottom:60px;" width="160" height="100" viewBox="0 0 160 100" aria-hidden="true">
    <rect x="0" y="30" width="50" height="60" rx="4" fill="#8B0000" opacity="0.15"/>
    <rect x="55" y="20" width="50" height="70" rx="4" fill="#8B0000" opacity="0.25"/>
    <rect x="110" y="10" width="50" height="80" rx="4" fill="#8B0000" opacity="0.35"/>
    <text x="85" y="95" text-anchor="middle" font-size="10" fill="#999999" font-family:'Microsoft YaHei', Arial;">梯度表</text>
  </svg>

  <!-- Page number badge -->
  <svg style="position:absolute; right:32px; bottom:24px;" width="36" height="36" viewBox="0 0 36 36">
    <circle cx="18" cy="18" r="18" fill="#8B0000"/>
    <text x="18" y="18" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF" font-family:'Microsoft YaHei', Arial;">12</text>
  </svg>
</div>
</body>
</html>
