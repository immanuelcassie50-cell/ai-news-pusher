<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>互动引导设计</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
}
.slide-content {
  width: 960px;
  height: 540px;
  position: relative;
  transform-origin: center center;
  background: #F5F5F5;
}
</style>
<script>
function scaleSlide() {
  const slide = document.querySelector('.slide-content');
  if (!slide) return;
  const slideWidth = 960;
  const slideHeight = 540;
  const scaleX = window.innerWidth / slideWidth;
  const scaleY = window.innerHeight / slideHeight;
  const scale = Math.min(scaleX, scaleY);
  slide.style.width = slideWidth + 'px';
  slide.style.height = slideHeight + 'px';
  slide.style.transform = `scale(${scale})`;
  slide.style.transformOrigin = 'center center';
  slide.style.flexShrink = '0';
}
window.addEventListener('load', scaleSlide);
window.addEventListener('resize', scaleSlide);
</script>
</head>
<body>
<div class="slide-content">
  <!-- Top accent bar -->
  <svg style="position:absolute; top:0; left:0;" width="960" height="6" viewBox="0 0 960 6">
    <rect width="960" height="6" fill="#8B0000"/>
  </svg>

  <!-- Title -->
  <p style="position:absolute; left:60px; top:40px; margin:0; font-size:28px; font-weight:700; color:#8B0000; font-family:'Microsoft YaHei', Arial;">互动引导设计</p>

  <!-- Three columns for interaction types -->
  <div style="position:absolute; left:60px; top:100px; width:260px;">
    <!-- Card 1 -->
    <div style="background:#FFFFFF; border-radius:8px; padding:20px; height:180px; display:flex; flex-direction:column;">
      <svg style="flex-shrink:0; margin-bottom:12px;" width="40" height="40" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="20" fill="#8B0000" opacity="0.15"/>
        <path d="M12 20 L28 20 M20 12 L20 28" stroke="#8B0000" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <p style="margin:0 0 8px 0; font-size:14px; font-weight:700; color:#333333; font-family:'Microsoft YaHei', Arial;">小组讨论</p>
      <p style="margin:0; font-size:13px; color:#666666; font-family:'Microsoft YaHei', Arial;">分享一次自己见过的"表对了但方向错了"的案例</p>
    </div>
  </div>

  <div style="position:absolute; left:350px; top:100px; width:260px;">
    <!-- Card 2 -->
    <div style="background:#FFFFFF; border-radius:8px; padding:20px; height:180px; display:flex; flex-direction:column;">
      <svg style="flex-shrink:0; margin-bottom:12px;" width="40" height="40" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="20" fill="#C41E3A" opacity="0.15"/>
        <circle cx="20" cy="20" r="8" stroke="#C41E3A" stroke-width="2" fill="none"/>
        <path d="M20 12 L20 8" stroke="#C41E3A" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <p style="margin:0 0 8px 0; font-size:14px; font-weight:700; color:#333333; font-family:'Microsoft YaHei', Arial;">反思问题</p>
      <p style="margin:0; font-size:13px; color:#666666; font-family:'Microsoft YaHei', Arial;">你有没有过先看表格再问人的经历？</p>
    </div>
  </div>

  <div style="position:absolute; left:640px; top:100px; width:260px;">
    <!-- Card 3 -->
    <div style="background:#FFFFFF; border-radius:8px; padding:20px; height:180px; display:flex; flex-direction:column;">
      <svg style="flex-shrink:0; margin-bottom:12px;" width="40" height="40" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="20" fill="#8B0000" opacity="0.15"/>
        <path d="M14 16 L26 16 L26 28 L14 28 Z" stroke="#8B0000" stroke-width="2" fill="none"/>
        <circle cx="17" cy="20" r="2" fill="#8B0000"/>
        <circle cx="23" cy="20" r="2" fill="#8B0000"/>
      </svg>
      <p style="margin:0 0 8px 0; font-size:14px; font-weight:700; color:#333333; font-family:'Microsoft YaHei', Arial;">角色扮演</p>
      <p style="margin:0; font-size:13px; color:#666666; font-family:'Microsoft YaHei', Arial;">模拟一次先问人再检查表格的谈话</p>
    </div>
  </div>

  <!-- FAQ section -->
  <div style="position:absolute; left:60px; top:310px; width:840px; background:#FFFFFF; border-left:4px solid #C41E3A; padding:16px 20px;">
    <p style="margin:0 0 8px 0; font-size:14px; font-weight:700; color:#C41E3A; font-family:'Microsoft YaHei', Arial;">常见问题应对</p>
    <p style="margin:0; font-size:14px; color:#333333; font-family:'Microsoft YaHei', Arial;">
      <span style="color:#8B0000; font-weight:600;">家长坚持：</span>"分数够了就要冲好学校"
    </p>
    <p style="margin:8px 0 0 0; font-size:13px; color:#666666; font-family:'Microsoft YaHei', Arial;">应对思路：先肯定意愿，再引导思考"冲进去之后呢？这个方向是不是孩子想要的？"</p>
  </div>

  <!-- Page number badge -->
  <svg style="position:absolute; right:32px; bottom:24px;" width="36" height="36" viewBox="0 0 36 36">
    <circle cx="18" cy="18" r="18" fill="#8B0000"/>
    <text x="18" y="18" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF" font-family:'Microsoft YaHei', Arial;">15</text>
  </svg>
</div>
</body>
</html>
