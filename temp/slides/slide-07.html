<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动机与心理安全感</title>
<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; display:flex; justify-content:center; align-items:center; background:#000; }
.slide-content { width:960px; height:540px; position:relative; transform-origin:center center; }
</style>
<script>
function scaleSlide() {
  const slide = document.querySelector('.slide-content');
  if (!slide) return;
  const scaleX = window.innerWidth / 960;
  const scaleY = window.innerHeight / 540;
  const scale = Math.min(scaleX, scaleY);
  slide.style.width = '960px';
  slide.style.height = '540px';
  slide.style.transform = 'scale(' + scale + ')';
  slide.style.transformOrigin = 'center center';
}
window.addEventListener('load', scaleSlide);
window.addEventListener('resize', scaleSlide);
</script>
</head>
<body>
<div class="slide-content" style="background:#fefae0;">
  <div style="position:absolute; top:0; left:0; width:960px; height:6px; background:#e76f51;"></div>
  <div style="position:absolute; top:40px; left:80px;">
    <h2 style="margin:0; font-family:'Times New Roman', serif; font-size:36px; font-weight:700; color:#264653;">动机与心理安全感的关系</h2>
    <p style="margin:8px 0 0 0; font-family:'Times New Roman', serif; font-size:16px; color:#e76f51;">Relationship & Application</p>
  </div>
  <svg width="800" height="2" style="position:absolute; top:120px; left:80px;">
    <rect width="800" height="2" fill="#264653" opacity="0.1"/>
  </svg>

  <!-- Central diagram showing relationship -->
  <div style="position:absolute; top:150px; left:80px; right:80px; height:200px;">
    <!-- Motivation box -->
    <div style="position:absolute; left:60px; top:40px; width:260px; height:120px; background:#264653; border-radius:12px; padding:20px;">
      <p style="margin:0 0 8px 0; font-family:'Times New Roman', serif; font-size:18px; font-weight:700; color:#e9c46a;">学习动机</p>
      <p style="margin:0; font-family:'Times New Roman', serif; font-size:12px; color:#ffffff; opacity:0.8; line-height:1.6;">内在驱动力<br/>目标导向<br/>持续学习意愿</p>
    </div>

    <!-- Arrow -->
    <svg style="position:absolute; left:340px; top:80px;" width="80" height="40" viewBox="0 0 80 40">
      <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#264653"/>
        </marker>
      </defs>
      <line x1="0" y1="20" x2="60" y2="20" stroke="#264653" stroke-width="2" marker-end="url(#arrowhead)"/>
    </svg>

    <!-- Central connection -->
    <div style="position:absolute; left:420px; top:20px; width:160px; height:160px; background:#2a9d8f; border-radius:80px; display:flex; flex-direction:column; align-items:center; justify-content:center;">
      <p style="margin:0 0 4px 0; font-family:'Times New Roman', serif; font-size:14px; font-weight:600; color:#ffffff;">相互</p>
      <p style="margin:0 0 4px 0; font-family:'Times New Roman', serif; font-size:14px; font-weight:600; color:#ffffff;">促进</p>
      <p style="margin:8px 0 0 0; font-family:'Times New Roman', serif; font-size:11px; color:#e9c46a;">Mutual</p>
      <p style="margin:0; font-family:'Times New Roman', serif; font-size:11px; color:#e9c46a;">Enhancement</p>
    </div>

    <!-- Arrow -->
    <svg style="position:absolute; right:340px; top:80px;" width="80" height="40" viewBox="0 0 80 40">
      <line x1="20" y1="20" x2="80" y2="20" stroke="#2a9d8f" stroke-width="2" marker-end="url(#arrowhead)"/>
    </svg>

    <!-- Psychological Safety box -->
    <div style="position:absolute; right:60px; top:40px; width:260px; height:120px; background:#e76f51; border-radius:12px; padding:20px;">
      <p style="margin:0 0 8px 0; font-family:'Times New Roman', serif; font-size:18px; font-weight:700; color:#ffffff;">心理安全感</p>
      <p style="margin:0; font-family:'Times New Roman', serif; font-size:12px; color:#ffffff; opacity:0.9; line-height:1.6;">表达自由<br/>容错空间<br/>支持性环境</p>
    </div>
  </div>

  <!-- Key points at bottom -->
  <div style="position:absolute; bottom:60px; left:80px; right:80px;">
    <div style="display:flex; gap:20px;">
      <div style="flex:1; background:#ffffff; border-radius:8px; padding:16px 20px; border-top:3px solid #264653;">
        <p style="margin:0 0 4px 0; font-family:'Times New Roman', serif; font-size:13px; font-weight:600; color:#264653;">心理安全感 → 增强内在动机</p>
        <p style="margin:0; font-family:'Times New Roman', serif; font-size:12px; color:#666; line-height:1.5;">当学习者感到安全时，更愿意探索未知领域</p>
      </div>
      <div style="flex:1; background:#ffffff; border-radius:8px; padding:16px 20px; border-top:3px solid #2a9d8f;">
        <p style="margin:0 0 4px 0; font-family:'Times New Roman', serif; font-size:13px; font-weight:600; color:#264653;">内在动机 → 提升心理安全感</p>
        <p style="margin:0; font-family:'Times New Roman', serif; font-size:12px; color:#666; line-height:1.5;">内在兴趣让人更敢于表达真实想法</p>
      </div>
    </div>
  </div>

  <svg style="position:absolute; right:32px; bottom:24px;" width="36" height="36">
    <circle cx="18" cy="18" r="18" fill="#264653"/>
    <text x="18" y="18" text-anchor="middle" dominant-baseline="central" font-family:"Times New Roman" font-size="14" font-weight="600" fill="#ffffff">7</text>
  </svg>
</div>
</body>
</html>
