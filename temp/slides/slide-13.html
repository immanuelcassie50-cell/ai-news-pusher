<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教学流程</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
}
.slide-content {
  width: 960px;
  height: 540px;
  position: relative;
  transform-origin: center center;
  background: #F5F5F5;
}
</style>
<script>
function scaleSlide() {
  const slide = document.querySelector('.slide-content');
  if (!slide) return;
  const slideWidth = 960;
  const slideHeight = 540;
  const scaleX = window.innerWidth / slideWidth;
  const scaleY = window.innerHeight / slideHeight;
  const scale = Math.min(scaleX, scaleY);
  slide.style.width = slideWidth + 'px';
  slide.style.height = slideHeight + 'px';
  slide.style.transform = `scale(${scale})`;
  slide.style.transformOrigin = 'center center';
  slide.style.flexShrink = '0';
}
window.addEventListener('load', scaleSlide);
window.addEventListener('resize', scaleSlide);
</script>
</head>
<body>
<div class="slide-content">
  <!-- Top accent bar -->
  <svg style="position:absolute; top:0; left:0;" width="960" height="6" viewBox="0 0 960 6">
    <rect width="960" height="6" fill="#8B0000"/>
  </svg>

  <!-- Title -->
  <p style="position:absolute; left:60px; top:40px; margin:0; font-size:28px; font-weight:700; color:#8B0000; font-family:'Microsoft YaHei', Arial;">教学流程</p>

  <!-- Timeline/Process layout -->
  <div style="position:absolute; left:60px; top:110px; width:840px;">
    <!-- Step 1 -->
    <div style="display:flex; align-items:flex-start; margin-bottom:24px;">
      <svg style="flex-shrink:0;" width="40" height="40" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="20" fill="#8B0000"/>
        <text x="20" y="20" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#FFFFFF" font-family:'Microsoft YaHei', Arial;">1</text>
      </svg>
      <div style="margin-left:16px; padding-top:8px;">
        <p style="margin:0 0 4px 0; font-size:15px; font-weight:600; color:#333333; font-family:'Microsoft YaHei', Arial;">提问导入</p>
        <p style="margin:0; font-size:14px; color:#666666; font-family:'Microsoft YaHei', Arial;">你认为志愿填报最重要的是什么？</p>
      </div>
    </div>

    <!-- Connector line -->
    <svg style="position:absolute; left:80px; top:150px;" width="2" height="30" aria-hidden="true">
      <rect width="2" height="30" fill="#C41E3A"/>
    </svg>

    <!-- Step 2 -->
    <div style="display:flex; align-items:flex-start; margin-bottom:24px;">
      <svg style="flex-shrink:0;" width="40" height="40" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="20" fill="#8B0000"/>
        <text x="20" y="20" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#FFFFFF" font-family:'Microsoft YaHei', Arial;">2</text>
      </svg>
      <div style="margin-left:16px; padding-top:8px;">
        <p style="margin:0 0 4px 0; font-size:15px; font-weight:600; color:#333333; font-family:'Microsoft YaHei', Arial;">讲解冲稳保的历史和作用</p>
        <p style="margin:0; font-size:14px; color:#666666; font-family:'Microsoft YaHei', Arial;">介绍冲稳保的起源、功能及局限性</p>
      </div>
    </div>

    <!-- Connector line -->
    <svg style="position:absolute; left:80px; top:220px;" width="2" height="30" aria-hidden="true">
      <rect width="2" height="30" fill="#C41E3A"/>
    </svg>

    <!-- Step 3 -->
    <div style="display:flex; align-items:flex-start; margin-bottom:24px;">
      <svg style="flex-shrink:0;" width="40" height="40" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="20" fill="#8B0000"/>
        <text x="20" y="20" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#FFFFFF" font-family:'Microsoft YaHei', Arial;">3</text>
      </svg>
      <div style="margin-left:16px; padding-top:8px;">
        <p style="margin:0 0 4px 0; font-size:15px; font-weight:600; color:#333333; font-family:'Microsoft YaHei', Arial;">展示案例，让孩子先看表再问人</p>
        <p style="margin:0; font-size:14px; color:#666666; font-family:'Microsoft YaHei', Arial;">引导学员从旁观者角度观察</p>
      </div>
    </div>

    <!-- Connector line -->
    <svg style="position:absolute; left:80px; top:290px;" width="2" height="30" aria-hidden="true">
      <rect width="2" height="30" fill="#C41E3A"/>
    </svg>

    <!-- Step 4 -->
    <div style="display:flex; align-items:flex-start; margin-bottom:24px;">
      <svg style="flex-shrink:0;" width="40" height="40" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="20" fill="#8B0000"/>
        <text x="20" y="20" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#FFFFFF" font-family:'Microsoft YaHei', Arial;">4</text>
      </svg>
      <div style="margin-left:16px; padding-top:8px;">
        <p style="margin:0 0 4px 0; font-size:15px; font-weight:600; color:#333333; font-family:'Microsoft YaHei', Arial;">引导讨论</p>
        <p style="margin:0; font-size:14px; color:#666666; font-family:'Microsoft YaHei', Arial;">表对和方向对，哪个更重要？</p>
      </div>
    </div>

    <!-- Connector line -->
    <svg style="position:absolute; left:80px; top:360px;" width="2" height="30" aria-hidden="true">
      <rect width="2" height="30" fill="#C41E3A"/>
    </svg>

    <!-- Step 5 -->
    <div style="display:flex; align-items:flex-start;">
      <svg style="flex-shrink:0;" width="40" height="40" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="20" fill="#C41E3A"/>
        <text x="20" y="20" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="#FFFFFF" font-family:'Microsoft YaHei', Arial;">5</text>
      </svg>
      <div style="margin-left:16px; padding-top:8px;">
        <p style="margin:0 0 4px 0; font-size:15px; font-weight:600; color:#333333; font-family:'Microsoft YaHei', Arial;">总结</p>
        <p style="margin:0; font-size:14px; color:#8B0000; font-family:'Microsoft YaHei', Arial; font-weight:600;">冲稳保是语法不是方法</p>
      </div>
    </div>
  </div>

  <!-- Page number badge -->
  <svg style="position:absolute; right:32px; bottom:24px;" width="36" height="36" viewBox="0 0 36 36">
    <circle cx="18" cy="18" r="18" fill="#8B0000"/>
    <text x="18" y="18" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF" font-family:'Microsoft YaHei', Arial;">13</text>
  </svg>
</div>
</body>
</html>
