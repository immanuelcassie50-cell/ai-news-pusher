<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目录</title>
<style>
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; display:flex; justify-content:center; align-items:center; background:#000; }
.slide-content { width:960px; height:540px; position:relative; transform-origin:center center; }
</style>
<script>
function scaleSlide() {
  const slide = document.querySelector('.slide-content');
  if (!slide) return;
  const scaleX = window.innerWidth / 960;
  const scaleY = window.innerHeight / 540;
  const scale = Math.min(scaleX, scaleY);
  slide.style.width = '960px';
  slide.style.height = '540px';
  slide.style.transform = 'scale(' + scale + ')';
  slide.style.transformOrigin = 'center center';
}
window.addEventListener('load', scaleSlide);
window.addEventListener('resize', scaleSlide);
</script>
</head>
<body>
<div class="slide-content" style="background:#fefae0;">
  <div style="position:absolute; top:60px; left:80px;">
    <h2 style="margin:0; font-family:'Times New Roman', serif; font-size:36px; font-weight:700; color:#264653;">目录</h2>
    <p style="margin:8px 0 0 0; font-family:'Times New Roman', serif; font-size:16px; color:#264653; opacity:0.6;">CONTENTS</p>
  </div>
  <svg width="800" height="2" style="position:absolute; top:130px; left:80px;">
    <rect width="800" height="2" fill="#264653" opacity="0.1"/>
  </svg>
  <div style="position:absolute; top:170px; left:80px; width:380px;">
    <div style="display:flex; align-items:center; margin-bottom:32px;">
      <div style="width:48px; height:48px; background:#264653; border-radius:8px; display:flex; align-items:center; justify-content:center; margin-right:20px;">
        <span style="font-family:'Times New Roman', serif; font-size:20px; font-weight:700; color:#e9c46a;">01</span>
      </div>
      <div>
        <p style="margin:0; font-family:'Times New Roman', serif; font-size:20px; font-weight:600; color:#264653;">动机的定义</p>
        <p style="margin:4px 0 0 0; font-family:'Times New Roman', serif; font-size:14px; color:#264653; opacity:0.6;">What is Motivation</p>
      </div>
    </div>
    <div style="display:flex; align-items:center; margin-bottom:32px;">
      <div style="width:48px; height:48px; background:#2a9d8f; border-radius:8px; display:flex; align-items:center; justify-content:center; margin-right:20px;">
        <span style="font-family:'Times New Roman', serif; font-size:20px; font-weight:700; color:#ffffff;">02</span>
      </div>
      <div>
        <p style="margin:0; font-family:'Times New Roman', serif; font-size:20px; font-weight:600; color:#264653;">动机的心理机制</p>
        <p style="margin:4px 0 0 0; font-family:'Times New Roman', serif; font-size:14px; color:#264653; opacity:0.6;">Psychological Mechanism</p>
      </div>
    </div>
    <div style="display:flex; align-items:center;">
      <div style="width:48px; height:48px; background:#e9c46a; border-radius:8px; display:flex; align-items:center; justify-content:center; margin-right:20px;">
        <span style="font-family:'Times New Roman', serif; font-size:20px; font-weight:700; color:#264653;">03</span>
      </div>
      <div>
        <p style="margin:0; font-family:'Times New Roman', serif; font-size:20px; font-weight:600; color:#264653;">动机的类型</p>
        <p style="margin:4px 0 0 0; font-family:'Times New Roman', serif; font-size:14px; color:#264653; opacity:0.6;">Types of Motivation</p>
      </div>
    </div>
  </div>
  <div style="position:absolute; top:170px; left:500px; width:380px;">
    <div style="display:flex; align-items:center; margin-bottom:32px;">
      <div style="width:48px; height:48px; background:#f4a261; border-radius:8px; display:flex; align-items:center; justify-content:center; margin-right:20px;">
        <span style="font-family:'Times New Roman', serif; font-size:20px; font-weight:700; color:#ffffff;">04</span>
      </div>
      <div>
        <p style="margin:0; font-family:'Times New Roman', serif; font-size:20px; font-weight:600; color:#264653;">心理安全感的定义</p>
        <p style="margin:4px 0 0 0; font-family:'Times New Roman', serif; font-size:14px; color:#264653; opacity:0.6;">What is Psychological Safety</p>
      </div>
    </div>
    <div style="display:flex; align-items:center; margin-bottom:32px;">
      <div style="width:48px; height:48px; background:#e76f51; border-radius:8px; display:flex; align-items:center; justify-content:center; margin-right:20px;">
        <span style="font-family:'Times New Roman', serif; font-size:20px; font-weight:700; color:#ffffff;">05</span>
      </div>
      <div>
        <p style="margin:0; font-family:'Times New Roman', serif; font-size:20px; font-weight:600; color:#264653;">动机与心理安全感</p>
        <p style="margin:4px 0 0 0; font-family:'Times New Roman', serif; font-size:14px; color:#264653; opacity:0.6;">Relationship & Application</p>
      </div>
    </div>
  </div>
  <svg style="position:absolute; right:32px; bottom:24px;" width="36" height="36">
    <circle cx="18" cy="18" r="18" fill="#264653"/>
    <text x="18" y="18" text-anchor="middle" dominant-baseline="central" font-family:"Times New Roman" font-size="14" font-weight="600" fill="#ffffff">2</text>
  </svg>
</div>
</body>
</html>
