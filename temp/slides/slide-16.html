<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第二章 分数是最后一个变量，不是第一个</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
}
.slide-content {
  width: 960px;
  height: 540px;
  position: relative;
  transform-origin: center center;
  background: #F5F5F5;
}
</style>
<script>
function scaleSlide() {
  const slide = document.querySelector('.slide-content');
  if (!slide) return;
  const slideWidth = 960;
  const slideHeight = 540;
  const scaleX = window.innerWidth / slideWidth;
  const scaleY = window.innerHeight / slideHeight;
  const scale = Math.min(scaleX, scaleY);
  slide.style.width = slideWidth + 'px';
  slide.style.height = slideHeight + 'px';
  slide.style.transform = `scale(${scale})`;
  slide.style.transformOrigin = 'center center';
  slide.style.flexShrink = '0';
}
window.addEventListener('load', scaleSlide);
window.addEventListener('resize', scaleSlide);
</script>
</head>
<body>
<div class="slide-content">
  <!-- Top accent bar -->
  <svg style="position:absolute; top:0; left:0;" width="960" height="6" viewBox="0 0 960 6">
    <rect width="960" height="6" fill="#8B0000"/>
  </svg>

  <!-- Chapter indicator -->
  <svg style="position:absolute; top:30px; right:60px;" width="80" height="28" viewBox="0 0 80 28">
    <rect width="80" height="28" rx="4" fill="#8B0000"/>
    <text x="40" y="18" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#FFFFFF" font-family:'Microsoft YaHei', Arial;">教学设计</text>
  </svg>

  <!-- Title -->
  <p style="position:absolute; left:60px; top:50px; margin:0; font-size:32px; font-weight:700; color:#333333; font-family:'Microsoft YaHei', Arial;">第二章</p>
  <p style="position:absolute; left:60px; top:95px; margin:0; font-size:26px; font-weight:700; color:#8B0000; font-family:'Microsoft YaHei', Arial;">分数是最后一个变量，不是第一个</p>

  <!-- Main content area - two column layout -->
  <!-- Left column: 教学要点 -->
  <div style="position:absolute; left:60px; top:170px; width:380px;">
    <p style="margin:0 0 16px 0; font-size:16px; font-weight:700; color:#8B0000; font-family:'Microsoft YaHei', Arial;">教学要点范围</p>
    <ul style="margin:0; padding-left:20px; font-size:14px; color:#333333; font-family:'Microsoft YaHei', Arial; line-height:2;">
      <li>志愿填报的正确顺序</li>
      <li>信息优先级</li>
    </ul>
  </div>

  <!-- Right column: 其他信息 -->
  <div style="position:absolute; right:60px; top:170px; width:380px;">
    <p style="margin:0 0 16px 0; font-size:16px; font-weight:700; color:#8B0000; font-family:'Microsoft YaHei', Arial;">授课信息</p>
    <ul style="margin:0; padding-left:20px; font-size:14px; color:#333333; font-family:'Microsoft YaHei', Arial; line-height:2;">
      <li><span style="color:#999999;">授课方式</span> 讲授+讨论</li>
      <li><span style="color:#999999;">时长</span> 约40分钟</li>
      <li><span style="color:#999999;">使用道具</span> 案例对话记录</li>
    </ul>
  </div>

  <!-- Key focus section -->
  <div style="position:absolute; left:60px; top:320px; width:840px; background:#FFFFFF; border-left:4px solid #8B0000; padding:16px 20px; box-sizing:border-box;">
    <p style="margin:0 0 8px 0; font-size:14px; font-weight:700; color:#8B0000; font-family:'Microsoft YaHei', Arial;">重难点</p>
    <p style="margin:0; font-size:15px; color:#333333; font-family:'Microsoft YaHei', Arial;">先问人再问分数的思维方式</p>
  </div>

  <!-- Visual - priority order diagram -->
  <div style="position:absolute; left:60px; top:400px; width:840px;">
    <p style="margin:0 0 12px 0; font-size:13px; color:#999999; font-family:'Microsoft YaHei', Arial;">正确的思考顺序</p>
    <div style="display:flex; align-items:center; gap:12px;">
      <svg style="flex-shrink:0;" width="80" height="36" viewBox="0 0 80 36">
        <rect width="80" height="36" rx="4" fill="#8B0000"/>
        <text x="40" y="22" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#FFFFFF" font-family:'Microsoft YaHei', Arial;">人</text>
      </svg>
      <svg width="24" height="16" viewBox="0 0 24 16" aria-hidden="true">
        <path d="M0 8 L20 8 M14 4 L20 8 L14 12" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <svg style="flex-shrink:0;" width="80" height="36" viewBox="0 0 80 36">
        <rect width="80" height="36" rx="4" fill="#C41E3A"/>
        <text x="40" y="22" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#FFFFFF" font-family:'Microsoft YaHei', Arial;">方向</text>
      </svg>
      <svg width="24" height="16" viewBox="0 0 24 16" aria-hidden="true">
        <path d="M0 8 L20 8 M14 4 L20 8 L14 12" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <svg style="flex-shrink:0;" width="80" height="36" viewBox="0 0 80 36">
        <rect width="80" height="36" rx="4" fill="#999999"/>
        <text x="40" y="22" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#FFFFFF" font-family:'Microsoft YaHei', Arial;">分数</text>
      </svg>
    </div>
  </div>

  <!-- Page number badge -->
  <svg style="position:absolute; right:32px; bottom:24px;" width="36" height="36" viewBox="0 0 36 36">
    <circle cx="18" cy="18" r="18" fill="#8B0000"/>
    <text x="18" y="18" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#FFFFFF" font-family:'Microsoft YaHei', Arial;">16</text>
  </svg>
</div>
</body>
</html>
